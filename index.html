<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>男ならみんな押すボタン</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f7;font-family:system-ui,sans-serif} button{border:0;border-radius:10px;padding:1.1em 2em;background:#1864d8;color:white;font:700 clamp(1.15rem,4vw,1.5rem) system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #104a9e;transition:transform .1s,box-shadow .1s} button:active,button.pressed{transform:translateY(5px);box-shadow:0 0 0 #104a9e} button:focus-visible{outline:3px solid #111;outline-offset:5px}
</style>
</head>
<body>
<button type="button" id="button">私は18歳以上です</button>
<script>const button=document.querySelector('#button');button.addEventListener('click',()=>{button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),200)});</script>
</body>
</html>
