<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>男ならみんな押すボタン</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f7;font-family:system-ui,sans-serif;overflow:hidden}
body.celebrating{animation:rainbow 3s linear}
@keyframes rainbow{0%,100%{background:#f7f7f7} 10%{background:#ffb3bb} 25%{background:#ffe18d} 40%{background:#b9f5ad} 55%{background:#a5edff} 70%{background:#c3b1ff} 85%{background:#ffb5ee}}
button{position:relative;z-index:2;border:0;border-radius:10px;padding:1.1em 2em;background:#1864d8;color:white;font:700 clamp(1.15rem,4vw,1.5rem) system-ui,sans-serif;cursor:pointer;box-shadow:0 5px 0 #104a9e;transition:transform .1s,box-shadow .1s}
button:active,button:disabled{transform:translateY(5px);box-shadow:0 0 0 #104a9e} button:disabled{cursor:default} button:focus-visible{outline:3px solid #111;outline-offset:5px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
</style>
</head>
<body>
<button type="button" id="button">私は18歳以上です</button>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
const button = document.querySelector('#button');
const canvas = document.querySelector('#confetti');
const context = canvas.getContext('2d');
const colors = ['#ff4264','#ffcb38','#49d878','#28bfff','#a86cff','#ff65cf'];
button.addEventListener('click', () => {
  button.disabled = true;
  document.body.classList.add('celebrating');
  const width = innerWidth, height = innerHeight;
  const ratio = devicePixelRatio || 1;
  canvas.width = width * ratio; canvas.height = height * ratio;
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  const pieces = Array.from({length: 180}, (_, i) => {
    const side = i % 2 === 0 ? 1 : -1;
    return {x: side === 1 ? 0 : width, y: height * .8,
      vx: side * (2 + Math.random() * 9), vy: -(8 + Math.random() * 12),
      size: 5 + Math.random() * 8, color: colors[i % colors.length],
      angle: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * .3};
  });
  const start = performance.now();
  function draw(now) {
    const elapsed = now - start;
    context.clearRect(0, 0, width, height);
    if (elapsed >= 3000) {
      document.body.classList.remove('celebrating');
      button.disabled = false;
      return;
    }
    const t = elapsed / 16.67;
    for (const p of pieces) {
      const x = p.x + p.vx * t, y = p.y + p.vy * t + .09 * t * t;
      context.save(); context.translate(x, y); context.rotate(p.angle + p.spin * t);
      context.globalAlpha = Math.min(1, (3000 - elapsed) / 400);
      context.fillStyle = p.color;
      context.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      context.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
});
</script>
</body>
</html>
